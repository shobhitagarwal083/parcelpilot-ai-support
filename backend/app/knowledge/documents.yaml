# Document authority manifest.
#
# Authority is DATA, never code. Which document outranks which, whether it is
# still current, when it took effect and whose account it applies to are all
# declared here and carried onto every chunk at ingest time. No module infers
# authority from a filename, a folder or a heuristic.
#
# A PDF in data/source/ with no entry here FAILS the ingest, loudly, naming the
# file. An untagged document has unknown authority, and silently defaulting it
# to tier 2 or 3 is exactly the guess this design exists to prevent.
#
# Tiers, from Support Policy v3 section 1:
#   1  signed customer agreement   (scoped to one account)
#   2  current support policy / SOP
#   3  current product documentation
#   4  historical tickets and internal notes  -- context only, never authority.
#      Tier 4 has no entry here: it comes from the tickets table, not a PDF.

documents:
  - doc_id: 01_Support_Policy_v3_CURRENT
    title: ParcelPilot Support Policy v3
    authority_tier: 2
    status: CURRENT
    effective_from: 2026-05-01
    scope: global
    version: v3
    supersedes: 02_Support_Policy_v2_DEPRECATED

  - doc_id: 02_Support_Policy_v2_DEPRECATED
    title: ParcelPilot Support Policy v2
    authority_tier: 2
    status: DEPRECATED
    effective_from: 2025-01-01
    # Superseded the day before v3 took effect. Retained and indexed so an
    # internal user can ask what the old policy said and get a warned answer;
    # excluded from every default search, at index level rather than by prompt.
    effective_to: 2026-04-30
    scope: global
    version: v2
    superseded_by: 01_Support_Policy_v3_CURRENT

  - doc_id: 03_Cancellation_and_Service_Credit_SOP_v4
    title: ParcelPilot Cancellation & Service Credit SOP v4
    authority_tier: 2
    status: CURRENT
    effective_from: 2026-06-15
    scope: global
    version: v4

  - doc_id: 04_Product_Operations_Guide_and_Known_Issues
    title: ParcelPilot Product Operations Guide
    authority_tier: 3
    status: CURRENT
    effective_from: 2026-08-14
    scope: global

  - doc_id: 05_Northstar_Logistics_Enterprise_Agreement
    title: ParcelPilot - Northstar Logistics Enterprise Agreement
    authority_tier: 1
    status: ACTIVE
    effective_from: 2026-01-01
    effective_to: 2026-12-31
    scope: account:ACCT-001

  - doc_id: 06_LumenWorks_Service_Agreement
