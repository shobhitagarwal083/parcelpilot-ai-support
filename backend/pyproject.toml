[project]
name = "parcelpilot-support"
version = "0.1.0"
description = "Authority-aware AI support system for ParcelPilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Pinned exactly, and not as housekeeping. Both of these parse the source
    # pack, and this system's claim is that the same question gives the same
    # answer -- which is only true if the same PDF gives the same sections.
    # pypdf 6.16.2 changed extraction to one token per line, so every numbered
    # heading stopped matching and the Northstar agreement silently lost its
    # sections: a green build serving an index with no citable clauses. A range
    # here means the answer depends on the day the image was built.
    "openpyxl==3.1.5",
    "pypdf==6.16.1",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
